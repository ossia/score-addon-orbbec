# Builds the depth-camera package -- one zip per architecture, containing every
# camera backend that platform can carry -- ready to be listed in
# ossia/score-packages.
#
# What it does *not* do is build score. The backends share no code with the
# score plug-in: they talk to it through the pure-C depthcam_abi.h and are
# dlopen'd at runtime. So -DSCORE_DEPTHCAM_BACKENDS_ONLY=1 needs a C++ compiler
# and the vendored SDKs and nothing else -- no score checkout, no Qt, no ossia
# SDK. That is what makes it possible to publish a package for a platform
# without a working score build on it, and it takes minutes rather than hours.
#
# fail-fast is off on purpose: the SDKs do not all support all three platforms,
# so one going red must not cancel the others.

name: Package

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          # `expect` is checked against the package afterwards. Every backend is
          # optional at configure time, so a missing system dependency otherwise
          # drops one silently and the build still passes.
          - name: "Linux (x86_64)"
            os: ubuntu-22.04
            arch: linux-x86_64
            expect: "orbbec freenect freenect2 k4a realsense"
            flags: ""

          - name: "macOS (arm64)"
            os: macos-15
            arch: darwin-aarch64
            # No Azure Kinect: Microsoft never released an SDK for macOS, so the
            # backend would build and then find nothing to load.
            expect: "orbbec freenect freenect2 realsense"
            flags: "-DCMAKE_OSX_ARCHITECTURES=arm64"

          - name: "Windows (x86_64)"
            os: windows-2022
            arch: windows-x86_64
            expect: "orbbec freenect freenect2 k4a realsense"
            flags: ""

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libusb-1.0-0-dev libudev-dev libturbojpeg0-dev ocl-icd-opencl-dev

      # No libusb, and no libjpeg-turbo. Off Linux neither is a system library,
      # and Homebrew's leave an absolute path in the shipped binary that only
      # exists on the machine that built it. Both come from the copies the
      # OrbbecSDK vendors instead -- see the libusb section of
      # Backends/CMakeLists.txt.
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install ninja -y --no-progress

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSCORE_DEPTHCAM_BACKENDS_ONLY=1 \
            ${{ matrix.config.flags }}

      - name: Build the package
        shell: bash
        run: cmake --build build --target depthcam-package

      - name: Check the package
        shell: bash
        run: |
          Deployment/CheckPackage.sh \
            build/depth-camera-stage/depth-camera "${{ matrix.config.expect }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: depth-camera-${{ matrix.config.arch }}
          path: build/depth-camera-${{ matrix.config.arch }}.zip
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/depth-camera-${{ matrix.config.arch }}.zip
          tag: ${{ github.ref }}
          overwrite: true

  # The manifest the package manager reads. Written once, from the tag, so the
  # download URLs cannot drift from the assets the jobs above just uploaded.
  manifest:
    name: Manifest
    needs: package
    if: startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Generate depth-camera.json
        run: |
          python3 Deployment/make_manifest.py \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --out depth-camera.json
          cat depth-camera.json

      - name: Attach to the release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: depth-camera.json
          tag: ${{ github.ref }}
          overwrite: true
